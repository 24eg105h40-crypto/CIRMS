services:
  # ─── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: cirms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

    # Health check — Render will mark the service healthy once this returns 200
    healthCheckPath: /api/auth/status

    # Environment variables — set secret values in the Render dashboard
    envVars:
      - key: PORT
        value: "8080"

      # ── Aiven MySQL ──────────────────────────────────────────────────────────
      - key: DATABASE_HOST
        sync: false          # Set in dashboard
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_USE_SSL
        value: "true"        # Aiven requires SSL

      # ── JWT ──────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: "86400000"

      # ── Admin seed account ───────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "System Administrator"

      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: CLOUDINARY_URL
        sync: false

      # ── CORS ─────────────────────────────────────────────────────────────────
      # Set this to your Vercel frontend URL after deployment
      # e.g. https://cirms.vercel.app,https://cirms-frontend.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
