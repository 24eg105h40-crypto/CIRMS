databases:
  # ─── Render MySQL Database ────────────────────────────────────────────────
  - name: cirms-mysql
    databaseName: cirms_db
    user: cirms_user
    plan: free
    region: oregon

services:
  # ─── Spring Boot Backend ──────────────────────────────────────────────────
  - type: web
    name: cirms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

    # Health check — Render marks service healthy once this returns 200
    healthCheckPath: /api/auth/status

    envVars:
      - key: PORT
        value: "8080"

      # ── Render MySQL (auto-wired from the database above) ─────────────────
      - key: DATABASE_HOST
        fromDatabase:
          name: cirms-mysql
          property: host

      - key: DATABASE_PORT
        fromDatabase:
          name: cirms-mysql
          property: port

      - key: DATABASE_NAME
        fromDatabase:
          name: cirms-mysql
          property: database

      - key: DATABASE_USERNAME
        fromDatabase:
          name: cirms-mysql
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: cirms-mysql
          property: password

      # Render internal network — no SSL needed
      - key: DB_USE_SSL
        value: "false"

      # ── JWT ───────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # Set in Render dashboard
      - key: JWT_EXPIRATION_MS
        value: "86400000"

      # ── Admin seed account ────────────────────────────────────────────────
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "System Administrator"

      # ── Cloudinary (image uploads) ────────────────────────────────────────
      - key: CLOUDINARY_URL
        sync: false

      # ── CORS (set to your Vercel URL after frontend is deployed) ──────────
      - key: CORS_ALLOWED_ORIGINS
        sync: false
