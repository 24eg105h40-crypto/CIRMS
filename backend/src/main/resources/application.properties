# ==========================================
# CIRMS Application Configuration
# ==========================================

server.port=${PORT:8080}

# Database Configuration (Render MySQL or local)
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:cirms_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool tuning for cloud DB
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration (local fallback, Cloudinary used in production)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
cirms.upload.dir=${FILE_UPLOAD_LOCATION:./uploads}

# Cloudinary (set CLOUDINARY_URL env var in production)
# CLOUDINARY_URL=cloudinary://api_key:api_secret@cloud_name

# JWT Security Configuration
cirms.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
cirms.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Development Admin Account
cirms.admin.email=${ADMIN_EMAIL:admin@cirms.com}
cirms.admin.password=${ADMIN_PASSWORD:ChangeThisAdminPassword123!}
cirms.admin.name=${ADMIN_NAME:System Administrator}

# Logging
logging.level.com.cirms=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
